name: Render Hihu (chunked)

on:
  workflow_dispatch:

jobs:
  render-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0, end: 393 }
          - { start: 394, end: 787 }
          - { start: 788, end: 1181 }
          - { start: 1182, end: 1575 }
          - { start: 1576, end: 1969 }
          - { start: 1970, end: 2363 }
          - { start: 2364, end: 2757 }
          - { start: 2758, end: 3152 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - name: Install dependencies
        run: npm install
      - name: Reassemble audio mix
        run: |
          mkdir -p public
          cat audio-parts/hihu_mix.wav.b64.part-* | base64 -d > public/hihu_mix.wav
          ls -la public/hihu_mix.wav
      - name: Render chunk ${{ matrix.start }}-${{ matrix.end }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/render-chunk.mjs ${{ matrix.start }} ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.start }}-${{ matrix.end }}
          path: out/hihu/chunks/chunk-${{ matrix.start }}-${{ matrix.end }}.mp4
          retention-days: 7

  render-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - name: Install dependencies
        run: npm install
      - name: Reassemble audio mix
        run: |
          mkdir -p public
          cat audio-parts/hihu_mix.wav.b64.part-* | base64 -d > public/hihu_mix.wav
          ls -la public/hihu_mix.wav
      - name: Render captions (green screen)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/render-chunk.mjs captions
      - uses: actions/upload-artifact@v4
        with:
          name: captions
          path: out/hihu/Hihu_Captions_GreenScreen.mp4
          retention-days: 7

  concat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [render-chunk, render-captions]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Reassemble audio mix
        run: |
          mkdir -p public
          cat audio-parts/hihu_mix.wav.b64.part-* | base64 -d > public/hihu_mix.wav
          ls -la public/hihu_mix.wav
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: captions
          path: captions
      - name: Concat + composite captions + mux audio
        run: |
          ls -la chunks/ captions/
          printf "file 'chunk-0-393.mp4'\nfile 'chunk-394-787.mp4'\nfile 'chunk-788-1181.mp4'\nfile 'chunk-1182-1575.mp4'\nfile 'chunk-1576-1969.mp4'\nfile 'chunk-1970-2363.mp4'\nfile 'chunk-2364-2757.mp4'\nfile 'chunk-2758-3152.mp4'\n" > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy video_nocaps.mp4
          ffmpeg -y -i video_nocaps.mp4 -i captions/Hihu_Captions_GreenScreen.mp4 -i public/hihu_mix.wav -filter_complex "[1:v]colorkey=0x00FF00:0.3:0.1[ck];[0:v][ck]overlay=0:0[v]" -map "[v]" -map 2:a -c:v libx264 -crf 18 -preset fast -c:a aac -b:a 192k -shortest Hihu_Video_Final_With_Captions.mp4
          ffmpeg -y -i video_nocaps.mp4 -i public/hihu_mix.wav -c:v copy -c:a aac -b:a 192k -shortest Hihu_Video_Final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 Hihu_Video_Final_With_Captions.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 Hihu_Video_Final.mp4
          ls -la *.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Hihu_Final
          path: |
            Hihu_Video_Final_With_Captions.mp4
            Hihu_Video_Final.mp4
          retention-days: 30
